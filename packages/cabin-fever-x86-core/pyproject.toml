[project]
name = "cabin-fever-x86-core"
version = "0.0.1a9"
description = "A shared game night with an AI companion over a simulated radio: play old text adventures together. Runs the game natively; Linux only."
readme = "README.md"
authors = [
    { name = "Adam Fourney", email = "adam.fourney@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["text-adventure", "interactive-fiction", "zmachine", "jericho", "voice", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # jericho builds a frotz fork from source and ships no wheels. Upstream
    # supports Linux and nothing else, so neither does this.
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12"
dependencies = [
    "soundfile",
    "numpy",
    "elevenlabs",
    "fastapi",
    "openai",
    "pydantic",
    "pyyaml",
    "uvicorn",
    "websockets",
    "jericho",
]

[project.urls]
Homepage = "https://github.com/afourney/cabin-fever-x86"
Repository = "https://github.com/afourney/cabin-fever-x86"
Issues = "https://github.com/afourney/cabin-fever-x86/issues"

[project.optional-dependencies]
# Only needed for the "azure" and "trapi" AI providers.
azure = ["azure-identity"]
telegram = ["telethon>=1.36"]

[project.scripts]
cf86-text = "cabin_fever_x86_core.text_client._main:main"
cf86-server = "cabin_fever_x86_core.server._main:main"
cf86-web = "cabin_fever_x86_core.web_client._main:main"
cf86-telegram = "cabin_fever_x86_core.telegram_client._main:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

# Lint and format configuration lives at the workspace root, so both packages
# are held to one standard. Only what pytest needs per-package is here.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
