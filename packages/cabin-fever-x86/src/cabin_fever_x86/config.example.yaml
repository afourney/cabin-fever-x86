# Cabin Fever x86 configuration. Copy to config.yaml and edit.
#
# ${ENV_VAR_NAME} references are resolved against the environment when the file
# is loaded. A reference to an unset variable is treated as if the key were not
# there at all, so the built-in default applies. Prefer these over pasting
# secrets into the file: config.yaml is gitignored, but env vars can't be
# committed by accident at all.

# Settings used only by the host-side sandbox launcher. 
launcher:

  # The package locator is any package specifier accepted by uv. It is used
  # only when building a new prepared guest; 
  #
  # Use the following to grab the latest pre-release from PyPI
  # package_locator: cabin-fever-x86~=0.0.1a1
  #
  # Or, use the following to grab the latest release from GitHub
  # package_locator: https://github.com/afourney/cabin-fever-x86/archive/refs/heads/main.tar.gz#subdirectory=packages/cabin-fever-x86-core

client:
  host: 127.0.0.1
  port: 5000
  elevenlabs_api_key: ${ELEVENLABS_API_KEY}

# Stable users and their browser/Telegram/Zello identities. Multiple accounts can
# share one user. Unlisted senders cannot contribute, even for guest.
# A sole user_id: guest with type: guest keeps the original radio prompt.
# With multiple users, guest access requires explicitly choosing Login as Guest.
# Removing the guest identity disables anonymous browser access; a user merely
# named guest is not enough. users: [] disables all browser access.
users:
  - user_id: guest
    identities:
      - type: guest
      # - type: telegram
      #   account_id: "123456789"
      # - type: zello
      #   channel: "Cabin Fever x86"
      #   account_id: "your-zello-username"
  # - user_id: operator
  #   identities:
  #     - type: login
  #       username: Night Owl  # Callsign, not user_id; case-insensitively unique.
  #       password_hash: "paste an Argon2id hash here, never the password"
#
# Generate a hash (the password is prompted for, not put in shell history):
# uv run python -c "from getpass import getpass; from argon2 import PasswordHasher; print(PasswordHasher().hash(getpass('Password: ')))"

web_gateway:
  # Default HTTP access is loopback-only (localhost / 127.0.0.1), including
  # the launcher's local forwarded port. Public/LAN access requires HTTPS.
  # Terminate TLS at a reverse proxy, preserve Host, and forward the scheme
  # only from trusted proxy IPs (Uvicorn FORWARDED_ALLOW_IPS; never '*').
  # public_origin: https://radio.example.com
  # HTTPS cookies are Secure; loopback HTTP cookies are not. Both are
  # HttpOnly, SameSite=Strict, host-only. No wildcard origins are accepted.
  data_dir: data/web_gateway
  # A persistent random signing.key and revocable sessions.sqlite3 live here.
  # Keep this directory private, persistent, and shared by gateway workers.
  # Optional signing_secret (32+ random characters) overrides signing.key;
  # supply it through an environment reference rather than committing it.
  session_idle_seconds: 3600
  session_max_seconds: 604800
  # The page renews via HTTP at most every five minutes; activity cannot
  # extend the absolute seven-day limit. Expired/revoked sockets close.

# Optional Telegram gateway with text and voice-note input. Install the core
# package's `telegram` extra and run cf86-telegram. Voice notes use the
# client.elevenlabs_api_key above. Add allowed accounts to users above;
# rejected attempts are logged with their numeric Telegram account ID.
telegram_gateway:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  api_id: ${TELEGRAM_API_ID}
  api_hash: ${TELEGRAM_API_HASH}

# Optional voice-only Zello gateway. Install the core package's `zello`
# extra and run cf86-zello. The credentials file uses zelpy's zello.yaml
# format. Configure channel/sender pairs in users above; all contributors to
# a channel must share one internal user. Others can listen, but their voice
# is ignored by the game. No configured contributors means startup fails.
# All identity channels run concurrently, each with its own automatically
# resumed game. Associations live in data/users/<user_id>/zello_gateway/sessions.json.
zello:
  credentials_file: ~/.apikeys/zello.yaml

server:
  interface: 127.0.0.1
  port: 5000

  # The model behind the voice on the other end of the channel. Every field is
  # optional: unset fields fall back to the provider's env vars, then defaults.
  ai_client:
    provider: openai  # openai | azure | gateway
    # model: gpt-5.4
    # base_url: https://...
    api_key: ${OPENAI_API_KEY}
    # azure authenticates with Azure credentials instead of a key, and needs
    # base_url and model set explicitly. Its token scope comes from here:
    # scope: api://your-resource/.default

  # How long the cabin stays quiet between events, in seconds. Each wait is
  # drawn at random from this range; set both to the same value for a fixed
  # cadence.
  cabin_events:
    min_delay: 90
    max_delay: 240
    # Pause scheduled cabin events and stage directions after this many seconds
    # without a transmission from the player.
    inactivity_timeout: 300

  # Once a reply comes back having used this many tokens, the companion makes an
  # excuse, writes the night down, and carries on from its notes. The count is
  # only known after a request, so leave room for one more turn between this and
  # the model's context limit.
  compaction_threshold: 140000
