[dependency-groups]
dev = [
    "ruff",
    "poethepoet",
    "codespell",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/cabin-fever-x86-core/src",
    "packages/cabin-fever-x86/src",
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # docstrings
    "SIM", # flake8-simplify
    "BLE", # flake8-blind-except
    "ISC", # implicit string concatenation
    "RUF", # ruff's own
]
ignore = [
    "E501",  # line too long; the formatter decides
    "UP017", # datetime.UTC alias
    "D203",  # conflicts with D211 (we use D211: no blank line before class)
    "D213",  # conflicts with D212 (we use D212: summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D"]

[tool.poe.tasks]
format = "ruff format --check --diff packages"
format-fix = "ruff format packages"

lint = "ruff check packages"
lint-fix = "ruff check --fix packages"

# Tests are skipped on purpose: some of them spell things wrong deliberately,
# to assert that a typo in a config file is reported rather than ignored.
# The ROT-13 hint books are skipped because their ciphertext is not English.
spell = "codespell -I .codespellignore --skip '*/tests/*,*/hints/*.rot13' packages README.md"

# Run from inside each package so pytest picks up that package's
# [tool.pytest.ini_options]; from the root it would find this file instead,
# which configures no testpaths and no asyncio mode.
test-core = { cmd = "pytest", cwd = "packages/cabin-fever-x86-core" }
test-app = { cmd = "pytest", cwd = "packages/cabin-fever-x86" }
test = ["test-core", "test-app"]
# Node 22.8+; no npm dependencies are needed for the browser playback tests.
test-web = "node --test packages/cabin-fever-x86-core/tests/pcm-player.test.mjs"

# Separate out-dirs: `uv build --package` writes to the root dist/, so two
# builds on one machine would otherwise pile into the same folder and the
# release workflow could not tell which wheel it was checking.
build-core = "uv build --package cabin-fever-x86-core --out-dir dist/core"
build-app = "uv build --package cabin-fever-x86 --out-dir dist/app"
build = ["build-core", "build-app"]
build-clean = { shell = "rm -rf dist && uv build --package cabin-fever-x86-core --out-dir dist/core && uv build --package cabin-fever-x86 --out-dir dist/app" }

# Everything CI runs on a pull request, minus the tests.
check = ["format", "lint", "spell"]
check-all = ["format", "lint", "spell", "test"]
fix-all = ["format-fix", "lint-fix"]
